# Flujo compacto para compilar el APK (assembleRelease) y subirlo como artefacto.
name: Android CI
on:
  push:
    branches: [ master ]   # rama objetivo
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Clona el repo
      - name: Checkout
        uses: actions/checkout@v4

      # Configura JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Cache de Gradle para acelerar builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      # Prepara Android SDK / build-tools necesarios
      - name: Setup Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          build-tools: '33.0.2'
          force-avd-creation: false

      # Ejecuta la compilación (release sin firmar)
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -Porg.gradle.jvmargs="-Xmx3g" assembleRelease

      # Sube los APK generados como artefacto
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VINS-Mobile-Android-Updated
          path: app/build/outputs/**/*.apk
