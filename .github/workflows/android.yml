# Workflow compacto y robusto para compilar APK en la rama `master`.
# Usa r0adkll/setup-android para instalar SDK/platforms/build-tools y evita curl+unzip manual.
name: Android CI
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Clona el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Configura JDK (Java 11) necesario para Gradle/NDK toolchains
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Cache de Gradle para acelerar builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      # Instala Android SDK, platform-tools, build-tools y opcional NDK/CMake con una acción estable
      - name: Setup Android SDK and tools
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'
          ndk: '21.4.7075529'
          cmake: '3.10.2.4988404'

      # Si el repo contiene Ceres (ndk/ndk-build), intenta compilar las libs NDK
      - name: Build NDK libs if present
        run: |
          set -euo pipefail
          CERESPATH="app/libs/VINS-Mobile-master/VINS_ThirdPartyLib/ceres-solver/jni"
          if [ -d "$CERESPATH" ]; then
            echo "Ceres JNI encontrado en $CERESPATH — intentando ndk-build"
            if command -v ndk-build >/dev/null 2>&1; then
              (cd "$CERESPATH" && ndk-build -j$(nproc) || true)
            else
              echo "ndk-build no disponible en PATH; listando NDKs instalados:" && ls "$ANDROID_HOME/ndk" || true
            fi
          else
            echo "No se encontró Ceres JNI; saltando paso NDK"
          fi

      # Compila el APK (assembleRelease). No firma el APK aquí.
      - name: Build APK (assembleRelease)
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon -Porg.gradle.jvmargs="-Xmx3g" assembleRelease

      # Sube los APKs generados como artefacto del workflow
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/**/*.apk
