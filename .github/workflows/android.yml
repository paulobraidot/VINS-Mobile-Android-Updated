# Workflow compacto para compilar APK en la rama `master`.
name: Android CI
on:
  push:
    branches: [ master ]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Clonar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Configurar JDK (Java 11)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Cache de Gradle para acelerar builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      # Instalar Android commandline-tools y paquetes mínimos (con reintentos y comprobación)
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKROOT="$HOME/android-sdk"
          mkdir -p "$SDKROOT/cmdline-tools" "$SDKROOT/platform-tools"
          curl -fSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -o cmdline.zip
          if [ ! -s cmdline.zip ]; then echo "ERROR: cmdline.zip vacío o no descargado" >&2; exit 1; fi
          unzip -q cmdline.zip -d "$SDKROOT/cmdline-tools"
          if [ -d "$SDKROOT/cmdline-tools/cmdline-tools" ]; then mv "$SDKROOT/cmdline-tools/cmdline-tools" "$SDKROOT/cmdline-tools/latest"; fi
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDKROOT" >> $GITHUB_ENV
          echo "$SDKROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDKROOT/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$SDKROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses --sdk_root="$SDKROOT" || true

      # (Opcional) Compilar bibliotecas NDK/ndk-build (por ejemplo Ceres) si existen
      - name: Build NDK libs (ceres)
        run: |
          set -euo pipefail
          CERESPATH=app/libs/VINS-Mobile-master/VINS_ThirdPartyLib/ceres-solver/jni
          if [ -d "$CERESPATH" ]; then
            if command -v ndk-build >/dev/null 2>&1; then
              (cd "$CERESPATH" && ndk-build -j$(nproc) || true)
            else
              echo "ndk-build no encontrado en PATH; listando NDKs instalados:"; ls "$HOME/android-sdk/ndk" || true
            fi
          else
            echo "No se encontró Ceres JNI en $CERESPATH, saltando ndk-build"
          fi

      # Compilar APK (assembleRelease) — salida sin firmar
      - name: Build APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon -Porg.gradle.jvmargs="-Xmx3g" assembleRelease

      # Subir APK(s) generados como artefacto
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/**/*.apk
